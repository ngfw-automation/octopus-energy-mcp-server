# Reverse proxy for the Octopus Energy MCP server (streamable HTTP).
#
# MCP over streamable HTTP uses:
#   POST /mcp    client -> server requests (initialize, tools/list, tools/call)
#   GET  /mcp    server -> client event stream (SSE, long-lived)
#   DELETE /mcp  session termination
# So: no request buffering, generous read timeouts, HTTP/1.1 keepalive.

server {
    listen 8080;
    server_name _;

    # Tool results are JSON blobs (raw half-hourly data can be a few MB).
    client_max_body_size 10m;

    # --- Exposure --------------------------------------------------------
    # compose publishes this on 127.0.0.1 only, because the endpoint behind it
    # has no authentication. Host is passed through to the app, which validates
    # it (MCP_ALLOWED_HOSTS) -- so reaching this by any name other than
    # localhost means adding that name there too. For remote access, prefer a
    # tailnet over publishing the port: see "Exposure" in the README.
    #
    # --- TLS placeholder -------------------------------------------------
    # The container runs nonroot, so it listens on 8080 (unprivileged port).
    # Once the deployment has a real domain:
    #
    #   1. Put fullchain.pem / privkey.pem in ./deploy/nginx/tls/
    #   2. Mount it:   - ./deploy/nginx/tls:/etc/nginx/tls:ro
    #   3. Replace `listen 8080;` with:
    #        listen 80;
    #        return 301 https://$host$request_uri;
    #      and add a 443 server:
    #        listen 443 ssl;
    #        ssl_certificate     /etc/nginx/tls/fullchain.pem;
    #        ssl_certificate_key /etc/nginx/tls/privkey.pem;
    #      (plus the same location block)
    # ----------------------------------------------------------------------

    # Per-request DNS resolution via Docker's embedded DNS, so a restarted
    # backend container is picked up without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mcp_backend http://mcp:8000;

    location = /mcp {
        proxy_pass $mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_cache off;
        # SSE streams stay open for the whole MCP session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Nothing else is served.
    location / {
        return 404;
    }
}
