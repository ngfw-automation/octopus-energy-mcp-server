[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "octopus-mcp"
version = "0.2.0"
description = "Read-only MCP server exposing Octopus Energy (UK) consumption and tariff data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nikolay" }]
dependencies = [
    # mcp 2.x: FastMCP renamed to MCPServer (mcp.server.mcpserver).
    # Locked to the version verified against the HTTP/Docker deployment.
    "mcp==2.1.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    # IANA tz database for zoneinfo: Windows has no system zoneinfo, and the
    # Chainguard base image is minimal — the package is the reliable fallback.
    "tzdata>=2026.3",
]

[project.urls]
Homepage = "https://github.com/ngfw-automation/octopus-energy-mcp-server"
Repository = "https://github.com/ngfw-automation/octopus-energy-mcp-server"
Issues = "https://github.com/ngfw-automation/octopus-energy-mcp-server/issues"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.5"]

[project.scripts]
octopus-mcp = "octopus_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["_live_*.py", "_crosscheck_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
